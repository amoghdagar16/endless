[project]
name = "ai-accounting-backend"
version = "0.1.0"
description = "Accounting backend service inspired by QuickBooks V1 foundation"
requires-python = ">=3.11"
authors = [{ name = "AI Accounting Team" }]
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.30,<0.31",
    "SQLAlchemy>=2.0,<3.0",
    "psycopg[binary]>=3.1,<3.2",
    "alembic>=1.13,<1.14",
    "pydantic-settings>=2.3,<3.0",
    "python-dateutil>=2.9,<3.0",
    "httpx>=0.27,<0.28",
    "python-dotenv>=1.0,<1.1",
    "openpyxl>=3.1,<3.2",
    "python-slugify>=8.0,<9.0",
    "easyocr>=1.7,<2.0",
    "torch>=2.0,<3.0",
    "torchvision>=0.15,<1.0",
    "opencv-python>=4.8,<5.0",
    "pillow>=10.0,<11.0",
    "python-multipart>=0.0.6,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-asyncio>=0.23,<0.24",
    "httpx>=0.27,<0.28",
    "ruff>=0.6,<0.7",
    "black>=24.8,<25.0",
    "mypy>=1.10,<1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["app"]
